name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: pcov

      # composer install also creates .env from .env.example and sets APP_KEY.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      # Fails below the threshold. Baseline on the untouched code was 93.2%.
      # The local push hook reads --min from this line, so it lives here only.
      - name: Tests
        run: php artisan test --coverage --min=90

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build front end
        run: npm run build

      - name: Front-end tests (Vitest)
        run: npm test
